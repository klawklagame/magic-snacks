<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="สำรวจทุกของว่างเวทมนตร์ใน Clash of Clans พร้อมภาพ คำอธิบาย เคล็ดลับการใช้งาน" />
    <meta name="theme-color" content="#0a0a0a">
    <meta name="color-scheme" content="dark">
    <title>Magic Snacks · KLAWKLA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://klawkla.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Serif+Thai:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrap">

        <header class="hero reveal" style="--i:0;">
            <div class="container">
                <div class="hero-top">
                    <a class="hero-brand" href="https://www.klawkla.com/">
                        <img src="https://klawkla.com/content/images/2025/08/logo.webp" alt="แกล้วกล้า"
                            width="36" height="36" fetchpriority="high" decoding="async" />
                        <span>KLAWKLA</span>
                    </a>
                    <span class="hero-tag">เครื่องมือชาวแคลช</span>
                </div>

                <h1 class="hero-title">ข้อมูลของว่างเวทมนตร์</h1>

                <p class="hero-sub">
                    ข้อมูลของว่างเวทมนตร์ทั้งหมดใน Clash of Clans
                </p>
            </div>
        </header>

        <div class="infobar reveal" style="--i:1;" role="group" aria-label="ข้อมูลของว่างเวทมนตร์">
            <div class="container infobar-row">
                <button class="infobtn" type="button" data-info="source">ได้จากไหน?</button>
                <button class="infobtn" type="button" data-info="storage">การเก็บ</button>
                <button class="infobtn" type="button" data-info="usage">วิธีใช้งาน</button>
            </div>
        </div>

        <main class="viewport reveal" style="--i:2;" role="region" aria-roledescription="carousel" aria-label="Magic Snacks">
            <div class="container">
                <div class="viewport-inner">
                    <div class="track" id="track"></div>
                </div>
            </div>
        </main>

        <div class="controls-wrap reveal" style="--i:3;">
            <div class="container controls-row">
                <div class="controls-nav">
                    <button id="prev" class="nav-btn" type="button" aria-label="ก่อนหน้า">‹</button>
                    <div class="dots" id="dots" role="tablist" aria-label="ตัวบอกตำแหน่ง"></div>
                    <button id="next" class="nav-btn" type="button" aria-label="ถัดไป">›</button>
                </div>
                <button class="showall" id="btnAll" type="button">
                    <span>ดูทั้งหมด</span>
                </button>
            </div>
        </div>

        <footer class="foot reveal" style="--i:4;">
            <div class="container">
                <p class="credit">
                    สร้างโดยผู้เล่นแคลชเพื่อผู้เล่นแคลช ·
                    <a href="https://www.klawkla.com" target="_blank" rel="noopener noreferrer">klawkla.com</a>
                </p>
            </div>
        </footer>
    </div>

    <aside class="allpanel" id="allPanel" aria-hidden="true" aria-label="ของว่างทั้งหมด">
        <div class="allpanel-head">
            <span class="eyebrow">ของว่างทั้งหมด</span>
            <button class="close" id="closeAll" type="button" aria-label="ปิด">×</button>
        </div>
        <div class="allpanel-body">
            <div class="grid" id="allGrid" role="list"></div>
        </div>
    </aside>

    <aside class="infomodal" id="infoModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
        <article class="card ibox">
            <button class="iclose" id="infoClose" type="button" aria-label="ปิด">×</button>
            <span class="eyebrow">รายละเอียด</span>
            <h3 class="ibox-title" id="infoTitle"></h3>
            <div class="ibox-body" id="infoBody"></div>
        </article>
    </aside>

    <script src="script.js" defer></script>
</body>

</html>
