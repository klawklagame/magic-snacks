<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="สำรวจทุกของว่างเวทมนตร์ใน Clash of Clans พร้อมภาพ คำอธิบาย และเคล็ดลับการใช้งาน" />
    <meta name="theme-color" content="#0a0a0a">
    <meta name="color-scheme" content="dark">
    <title>Magic Snacks · KLAWKLA</title>
    <link rel="preconnect" href="https://klawkla.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <header class="topbar reveal" style="--i:0;">
            <a class="brand" href="https://www.klawkla.com/">
                <img src="https://klawkla.com/content/images/2025/08/logo.webp" alt="แกล้วกล้า"
                    width="34" height="34" fetchpriority="high" decoding="async" />
                <span class="brand-name">KLAWKLA</span>
            </a>
            <h1 class="topbar-title">ของว่างเวทมนตร์</h1>
            <span class="topbar-tag">เครื่องมือชาวแคลช</span>
        </header>

        <nav class="filters reveal" style="--i:1;" aria-label="กรองและข้อมูล">
            <div class="filter-group" id="filterCats"></div>
            <span class="filter-sep" aria-hidden="true"></span>
            <div class="filter-group">
                <button class="infobtn" type="button" data-info="source">ได้จากไหน?</button>
                <button class="infobtn" type="button" data-info="storage">การเก็บ</button>
                <button class="infobtn" type="button" data-info="usage">วิธีใช้งาน</button>
            </div>
        </nav>

        <div class="layout">
            <nav class="rail reveal" style="--i:2;" aria-label="รายการของว่าง">
                <div class="rail-scroll" id="rail" role="tablist" aria-orientation="vertical"></div>
            </nav>

            <main class="stage reveal" style="--i:3;" id="stage" role="region" aria-live="polite"
                aria-label="รายละเอียดของว่าง">
                <div class="stage-bg" aria-hidden="true"></div>
                <article class="detail" id="detail"></article>
                <div class="stage-nav-group">
                    <button class="stage-nav" id="prev" type="button" aria-label="ก่อนหน้า">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" /></svg>
                    </button>
                    <button class="stage-nav" id="next" type="button" aria-label="ถัดไป">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" /></svg>
                    </button>
                </div>
            </main>
        </div>

        <footer class="foot reveal" style="--i:4;">
            <p class="credit">
                สร้างโดยผู้เล่นแคลชเพื่อผู้เล่นแคลช ·
                <a href="https://www.klawkla.com" target="_blank" rel="noopener noreferrer">klawkla.com</a>
            </p>
        </footer>

    </div>

    <aside class="infomodal" id="infoModal" aria-hidden="true" role="dialog" aria-modal="true"
        aria-labelledby="infoTitle">
        <article class="ibox">
            <button class="iclose" id="infoClose" type="button" aria-label="ปิด">×</button>
            <span class="eyebrow">รายละเอียด</span>
            <h3 class="ibox-title" id="infoTitle"></h3>
            <div class="ibox-body" id="infoBody"></div>
        </article>
    </aside>

    <script src="script.js" defer></script>
</body>

</html>
